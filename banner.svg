<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Héctor Guevara · Desarrollador web en LAB</title>
  <desc id="d">Sitios rápidos, seguros y bilingües para negocios. Next.js, React, TypeScript, Supabase y Tailwind CSS.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="nombre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="difuso" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#fondo)"/>
  <rect width="1200" height="300" rx="18" fill="url(#rejilla)"/>
  <circle cx="1060" cy="30" r="150" fill="#22d3ee" fill-opacity="0.35" filter="url(#difuso)"/>
  <circle cx="140" cy="290" r="170" fill="#8b5cf6" fill-opacity="0.38" filter="url(#difuso)"/>

  <!-- Marca de código -->
  <g transform="translate(60 54)" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M14 0 L0 14 L14 28"/>
    <path d="M42 0 L56 14 L42 28"/>
    <path d="M33 -2 L23 30"/>
  </g>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="122" font-size="64" font-weight="800" fill="url(#nombre)" letter-spacing="1">Héctor Guevara</text>
    <text x="600" y="162" font-size="20" font-weight="700" fill="#67e8f9" letter-spacing="5">DESARROLLADOR WEB · LAB</text>
    <text x="600" y="200" font-size="22" fill="#cbd5e1">Sitios rápidos, seguros y bilingües para negocios</text>
  </g>

  <!-- Tecnologías -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">
    <g transform="translate(326 226)">
      <rect width="84" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="42" y="20">Next.js</text>
    </g>
    <g transform="translate(422 226)">
      <rect width="76" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="38" y="20">React</text>
    </g>
    <g transform="translate(510 226)">
      <rect width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="55" y="20">TypeScript</text>
    </g>
    <g transform="translate(632 226)">
      <rect width="102" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="51" y="20">Supabase</text>
    </g>
    <g transform="translate(746 226)">
      <rect width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="64" y="20">Tailwind CSS</text>
    </g>
  </g>
</svg>
